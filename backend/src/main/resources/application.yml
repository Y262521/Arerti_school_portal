spring:
  application:
    name: arerti-portal-backend

  # ---------- PostgreSQL ----------
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50        # handle 1500+ concurrent users
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 30           # batch inserts for bulk operations
        order_inserts: true
        order_updates: true

  # ---------- MongoDB ----------
  data:
    mongodb:
      uri: ${MONGO_URI}

  # ---------- Cache (in-memory for subjects, classes, curriculum) ----------
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s   # 5 min cache

  # ---------- File upload ----------
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# ---------- App ----------
app:
  storage:
    resources-dir: ${RESOURCES_DIR:/tmp/arerti-uploads}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_arerti_super_secret_key_must_be_at_least_256_bits_long_2026}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:komb41ew}
  api-key: ${CLOUDINARY_API_KEY:765123853833281}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: ${PORT:8080}
  # Tomcat tuning for 1500+ concurrent users
  tomcat:
    threads:
      max: 400
      min-spare: 20
    max-connections: 8192
    accept-count: 200
  error:
    include-message: always

logging:
  level:
    org.springframework.security: INFO
    com.arerti: DEBUG
