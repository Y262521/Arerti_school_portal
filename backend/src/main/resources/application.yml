spring:
  application:
    name: arerti-portal-backend

  # ---------- Relational DB ----------
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ---------- MongoDB ----------
  data:
    mongodb:
      uri: ${MONGO_URI}

  # ---------- File upload limits ----------
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# ---------- App ----------
app:
  storage:
    resources-dir: ${RESOURCES_DIR:/tmp/arerti-uploads}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_arerti_super_secret_key_must_be_at_least_256_bits_long_2026}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

server:
  port: ${PORT:8080}
  error:
    include-message: always

logging:
  level:
    org.springframework.security: INFO
    com.arerti: DEBUG
